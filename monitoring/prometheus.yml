# Standalone example. Merge this job into your existing scrape_configs.
scrape_configs:
  - job_name: spring-metric
    scrape_interval: 15s
    scrape_timeout: 10s
    metrics_path: /actuator/prometheus
    static_configs:
      # Spring Boot runs on the host; Compose maps this hostname to the host gateway.
      - targets: ['host.docker.internal:8081']
