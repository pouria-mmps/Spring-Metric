spring.application.name=SpringMetric

# Document application APIs only.
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.disable-swagger-default-url=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/springmetric}
spring.datasource.username=${DB_USERNAME:springmetric}
spring.datasource.password=${DB_PASSWORD:springmetric}
spring.datasource.hikari.pool-name=SpringMetricPool
# Small learning pool; tune from measurements, not request-thread count.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=3000
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate

# Keep the management surface limited to health and Prometheus scraping.
management.endpoints.web.exposure.include=health,prometheus
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}

# Completed HTTP requests only. Bounds control buckets, not request timeouts.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.minimum-expected-value.http.server.requests=1ms
management.metrics.distribution.maximum-expected-value.http.server.requests=5s
# Distribution settings match prefixes; exclude the in-progress request timer.
management.metrics.distribution.percentiles-histogram.http.server.requests.active=false
